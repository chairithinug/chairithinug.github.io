<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #main-container, #footer-container, body {
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
    <script>
        document.documentElement.classList.toggle(
            "dark",
            localStorage.theme === "dark" ||
            (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches),
        );
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

    <title>Anapat Chairithinugull – Data Scientist & Software Engineer | Resume | Copenhagen, Denmark</title>

    <!-- Preload CSS -->
    <link rel="preload" href="/styles.css" as="style">
    <!-- Regular stylesheet -->
    <link rel="stylesheet" href="/styles.css">

</head>

<body
    class="scroll-smooth bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 transition-colors duration-300 overflow-x-hidden w-full max-w-full ease-in-out min-h-screen flex flex-col">
    <!-- Header -->
    <div id="header-container"></div>
    <script src="/partials/header.js" defer></script>
    <!-- Progress Bar Container -->
    <div id="progress-bar"></div>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    <script src="/partials/sidebar.js" defer></script>

    <main class="relative z-10 space-y-10 mx-auto px-6 py-8 w-full md:pl-[12rem] md:pr-10 duration-300 ease-in-out flex-1"
        role="main">
        <section id="qa" aria-labelledby="qa-title">

                FAQ
            </h2>

            <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Flip Card 1 -->
                <div class="flip-card cursor-pointer" role="button" tabindex="0" aria-label="Flip card">
                    <div class="flip-card-inner">
                        <!-- Front -->
                        <div
                            class="flip-card-front bg-white dark:bg-gray-800 shadow rounded-xl p-4 transition-colors duration-300">
                            <h3 class="font-semibold text-gray-900 dark:text-gray-100">
                                Why USA?
                            </h3>
                            <p class="text-sm text-gray-600 dark:text-gray-300">

                            </p>
                        </div>
                        <!-- Back -->
                        <div
                            class="flip-card-back bg-white dark:bg-gray-900 shadow-lg rounded-xl p-6 transition-colors duration-300">
                            <p class="text-gray-700 dark:text-gray-200">
                                Thanks to my family who were willing to send me to the US. So I fulfilled my
                                family's dream!
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Flip Card 2 -->
                <div class="flip-card cursor-pointer" role="button" tabindex="0" aria-label="Flip card">
                    <div class="flip-card-inner">
                        <!-- Front -->
                        <div
                            class="flip-card-front bg-white dark:bg-gray-800 shadow rounded-xl p-4 transition-colors duration-300">
                            <h3 class="font-semibold text-gray-900 dark:text-gray-100">
                                Why Denmark?
                            </h3>
                            <p class="text-sm text-gray-600 dark:text-gray-300">

                            </p>
                        </div>
                        <!-- Back -->
                        <div
                            class="flip-card-back bg-white dark:bg-gray-900 shadow-lg rounded-xl p-6 transition-colors duration-300">
                            <p class="text-gray-700 dark:text-gray-200">
                                Got bored in Thailand, so why not Europe? Then, Denmark chose me.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Flip Card 3 -->
                <div class="flip-card cursor-pointer" role="button" tabindex="0" aria-label="Flip card">
                    <div class="flip-card-inner">
                        <!-- Front -->
                        <div
                            class="flip-card-front bg-white dark:bg-gray-800 shadow rounded-xl p-4 transition-colors duration-300">
                            <h3 class="font-semibold text-gray-900 dark:text-gray-100">
                                Cool website! How did you make it?
                            </h3>
                            <p class="text-sm text-gray-600 dark:text-gray-300">
                            </p>
                        </div>
                        <!-- Back -->
                        <div
                            class="flip-card-back bg-white dark:bg-gray-900 shadow-lg rounded-xl p-6 transition-colors duration-300">
                            <p class="text-gray-700 dark:text-gray-200">
                                Know the basic and 2 days with ChatGPT.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="/partials/footer.js" defer></script>

    <!-- External script -->
    <script src="script.js" defer></script>
    <script src="faq-script.js" defer></script>

</body>

</html>
