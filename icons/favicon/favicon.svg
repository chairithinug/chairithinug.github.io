<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="100" height="100" rx="22.5" ry="22.5" fill="url(#bg)"/>

  <!-- Decorative arc accent (top-right) -->
  <circle cx="82" cy="18" r="6" fill="rgba(255,255,255,0.35)"/>

  <!-- Bold "AC" initials -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'San Francisco', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="50" font-weight="900" fill="#ffffff" letter-spacing="-2">AC</text>

  <!-- Subtitle "MEW" -->
  <text x="50" y="83" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'San Francisco', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="1.2">MEW</text>
</svg>