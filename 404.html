<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found – Anapat Chairithinugull</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="icons/favicon.png" type="image/png">
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 transition-colors duration-300 flex flex-col items-center justify-center min-h-screen px-6">
    <header class="text-center mb-12">
        <h1 class="text-4xl font-bold">404</h1>
        <p class="text-xl mt-2">Oops! The page you are looking for cannot be found.</p>
    </header>

    <main class="max-w-xl text-center space-y-6">
        <p class="text-gray-700 dark:text-gray-300">
            It seems the link you followed is broken or the page has been removed.
        </p>

        <a href="/" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors duration-300">
            Go Back Home
        </a>

        <div class="mt-6 text-gray-500 dark:text-gray-400 text-sm">
            If you typed the URL manually, please check for errors.
        </div>
    </main>

    <footer class="mt-auto py-6 text-gray-600 dark:text-gray-400 text-sm text-center">
        &copy; 2025 Anapat Chairithinugull
    </footer>
</body>

</html>
